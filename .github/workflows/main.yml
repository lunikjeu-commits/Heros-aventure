name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Préparer les fichiers du jeu
        run: |
          mkdir www
          cp index.html *.css www/
          cp -r js www/js
      - name: Installer Capacitor et créer le projet Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.lunikapp.herosaventure",
            "appName": "Héros Aventure",
            "webDir": "www",
            "backgroundColor": "#0a0f1e"
          }
          JSON
          npx cap add android
          npx cap sync android
      - name: Paysage et plein écran
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml
          sed -i -e '/name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>' -e '/name="AppTheme.NoActionBar"/a\        <item name="android:windowBackground">#0A0F1E</item>' -e '/name="AppTheme.NoActionBar"/a\        <item name="android:navigationBarColor">#0A0F1E</item>' -e '/name="AppTheme.NoActionBar"/a\        <item name="android:statusBarColor">#0A0F1E</item>' android/app/src/main/res/values/styles.xml
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk heros-aventure.apk
      - uses: actions/upload-artifact@v4
        with:
          name: heros-aventure-apk
          path: heros-aventure.apk
      - name: Publier l'APK dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Héros Aventure (dernière version)
          files: heros-aventure.apk
